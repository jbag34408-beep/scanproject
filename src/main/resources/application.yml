spring:
  application:
    name: unfreeze-api
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # 스키마는 Flyway만 관리한다
  flyway:
    enabled: true

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

unfreeze:
  crypto:
    # 반드시 환경변수로 주입. 값이 없으면 기동 실패한다.
    key: ${UNFREEZE_CRYPTO_KEY}
