spring:
  config:
    # docker compose와 같은 .env 파일에서 DB 접속 정보와 UNFREEZE_CRYPTO_KEY를 읽는다
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/unfreeze
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  servlet:
    session:
      cookie:
        secure: false # 로컬은 http
